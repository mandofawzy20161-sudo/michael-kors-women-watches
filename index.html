const WA="201011926183", TEL="01011926183";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function getEl(id){ return document.getElementById(id); }

function card(p,i){
  const im=(p.images&&p.images[0])||"";
  return `<div class="card">
    <span class="badge">ORIGINAL</span>
    ${p.stock?'':'<span class="oos">غير متوفر</span>'}
    <img class="card-img" loading="lazy" src="${esc(im)}" data-open-index="${i}" alt="${esc(p.name)}">
    <div class="name">${esc(p.name)}</div>
    <div class="price">${Math.round(p.price)} جنيه</div>
    <div class="note">🚚 التوصيل مجاني</div>
    <div class="note">📦 يوجد معاينة للمنتج قبل الاستلام</div>
    <button class="details" type="button" data-open-index="${i}">تفاصيل</button>
    ${p.stock?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('أريد طلب ساعة Michael Kors حريمي موديل '+p.model+' بسعر '+Math.round(p.price)+' جنيه')}">اطلب عبر واتساب</a>`:''}
  </div>`;
}

function render(list=P){
  const grid=getEl("grid");
  grid.innerHTML=list.map(p=>card(p,P.indexOf(p))).join("");
}

getEl("q").addEventListener("input",e=>{
  const s=e.target.value.toLowerCase().trim();
  render(P.filter(p=>(p.name+" "+p.model).toLowerCase().includes(s)));
});

document.addEventListener("click",e=>{
  const openTarget=e.target.closest("[data-open-index]");
  if(openTarget){
    const i=Number(openTarget.dataset.openIndex);
    if(Number.isInteger(i) && P[i]) openP(i);
    return;
  }

  const thumb=e.target.closest("[data-thumb-index]");
  if(thumb){
    const pi=Number(thumb.dataset.productIndex);
    const ii=Number(thumb.dataset.thumbIndex);
    changeImage(pi,ii,thumb);
    return;
  }

  if(e.target.closest("[data-back]")) back();
});

function changeImage(productIndex,imageIndex,btn){
  const p=P[productIndex];
  if(!p || !p.images || !p.images[imageIndex]) return;
  const main=getEl("mainProductImage");
  if(main) main.src=p.images[imageIndex];
  document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}

function openP(i){
  const p=P[i];
  if(!p) return;

  const catalog=getEl("catalog");
  const detail=getEl("detail");
  const ims=(p.images&&p.images.length)?p.images:[""];

  catalog.style.display="none";
  detail.style.display="block";

  detail.innerHTML=`<button class="back" type="button" data-back>← رجوع للمنتجات</button>
    <img id="mainProductImage" class="mainimg" src="${esc(ims[0])}" alt="${esc(p.name)}">
    <div class="thumbs">
      ${ims.map((x,j)=>`<button type="button" class="thumb ${j?'':'active'}" data-product-index="${i}" data-thumb-index="${j}"><img loading="lazy" src="${esc(x)}" alt="صورة ${j+1}"></button>`).join("")}
    </div>
    <h2>${esc(p.name)}</h2>
    <div class="price">${Math.round(p.price)} جنيه</div>
    ${p.stock?'':'<div style="background:#ffe8e8;color:#9b0000;padding:12px;border-radius:9px;font-weight:bold">هذا الموديل غير متوفر حاليًا</div>'}
    <h3>مواصفات الساعة</h3>
    <table>${(p.specs||[]).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>
    ${p.stock?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('أريد طلب ساعة Michael Kors حريمي موديل '+p.model+' بسعر '+Math.round(p.price)+' جنيه')}">اطلب عبر واتساب</a>`:''}
    <a class="phone" href="tel:${TEL}">☎ اطلب عن طريق الهاتف — ${TEL}</a>`;

  window.scrollTo(0,0);
}

function back(){
  getEl("detail").style.display="none";
  getEl("catalog").style.display="block";
  window.scrollTo(0,0);
}

render();
</script></body></html>
